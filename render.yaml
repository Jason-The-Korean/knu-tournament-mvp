services:
  - type: web
    name: knu-arena-festa
    runtime: node
    branch: deploy/festa-https
    plan: starter
    buildCommand: node --version
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DB_PATH
        value: /var/data/tournament.sqlite
    disk:
      name: knu-arena-data
      mountPath: /var/data
      sizeGB: 1
