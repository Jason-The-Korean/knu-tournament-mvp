services:
  - type: web
    name: knu-arena-festa-free
    runtime: node
    branch: deploy/festa-free
    plan: free
    buildCommand: node --version
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DB_PATH
        value: /tmp/knu-arena-festa-free/tournament.sqlite
